<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Bugatti Chiron">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#1b2230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)" opacity="0.9"/>

  <!-- Card-like frame -->
  <g filter="url(#shadow)">
    <rect x="60" y="60" width="1080" height="580" rx="28" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
  </g>

  <!-- Simple car silhouette -->
  <path d="M260 430 C320 350, 430 310, 585 310 L700 310 C770 310, 835 330, 890 370 L955 420"
        fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="10" stroke-linecap="round"/>
  <path d="M240 440 L975 440" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="380" cy="450" r="42" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.45)" stroke-width="8"/>
  <circle cx="830" cy="450" r="42" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.45)" stroke-width="8"/>

  <!-- Text -->
  <text x="120" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="56" font-weight="700">Bugatti Chiron</text>
  <text x="120" y="240" fill="rgba(255,255,255,0.80)" font-family="Arial, sans-serif" font-size="26">
    Hypercar W16 • 1500 CP • AWD
  </text>

  <text x="120" y="610" fill="rgba(255,255,255,0.55)" font-family="Arial, sans-serif" font-size="18">
    Imagine placeholder (adaugă o poză reală dacă dorești)
  </text>
</svg>
