<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mașini disponibile - AutoPark Băneasa</title>
  <style>
    body { margin:0; font-family:Arial, sans-serif; color:#fff; background: linear-gradient(135deg,#0f0f10,#20232a); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 0; }
    .box { background: rgba(255,255,255,0.08); padding: 28px; border-radius: 16px; max-width: 1100px; width:clamp(300px,90vw,1100px); text-align:center; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .car {
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px;
      transition: 0.3s;
    }
    .car:hover { transform: scale(1.05); background: rgba(255,255,255,0.20); }

    .car img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
    }
    h3 { margin: 10px 0 8px; }

    .btn {
      border:1px solid #7fd1ff;
      background:transparent;
      color:#7fd1ff;
      padding:10px 16px;
      border-radius:10px;
      cursor:pointer;
      text-decoration:none;
      display:inline-block;
    }
    .btn:hover { background:rgba(127,209,255,.15); }
  </style>
</head>
<body>

  <div class="box">
    <h1>Mașini disponibile în AutoPark Băneasa</h1>

    <div class="grid">

      <!-- Mașina 1 -->
      <div class="car">
        <img src="audia3.jpg" alt="Mașină">
        <h3>Audi A3</h3>
      </div>

      <!-- Mașina 2 -->
      <div class="car">
        <img src="prius.jpg" alt="Mașină">
        <h3>Toyota Prius</h3>
      </div>

      <!-- Mașina 3 -->
      <div class="car">
        <img src="audia6.jpg" alt="Mașină">
        <h3>Audi A6</h3>
      </div>

      <!-- Mașina 4 -->
      <div class="car">
        <img src="fiat500.jpg" alt="Mașină">
        <h3>Fiat 500</h3>
      </div>

    </div>

    <div style="text-align:center;margin-top:20px;">
      <a class="btn" href="pagina_principala.php#parcuri">Înapoi la parc</a>
    </div>
  </div>

</body>
</html>
