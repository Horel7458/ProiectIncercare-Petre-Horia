<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Ferrari LaFerrari">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#2a1212"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#ffcc00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)" opacity="0.9"/>

  <g filter="url(#shadow)">
    <rect x="60" y="60" width="1080" height="580" rx="28" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
  </g>

  <!-- Sleek silhouette -->
  <path d="M230 430 C290 360, 420 320, 595 320 L720 320 C805 320, 875 345, 935 390 L990 430"
        fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="10" stroke-linecap="round"/>
  <path d="M210 442 L1000 442" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="370" cy="452" r="42" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.45)" stroke-width="8"/>
  <circle cx="850" cy="452" r="42" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.45)" stroke-width="8"/>

  <text x="120" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="56" font-weight="700">Ferrari LaFerrari</text>
  <text x="120" y="240" fill="rgba(255,255,255,0.80)" font-family="Arial, sans-serif" font-size="26">
    V12 hibrid • 963 CP • RWD
  </text>

  <text x="120" y="610" fill="rgba(255,255,255,0.55)" font-family="Arial, sans-serif" font-size="18">
    Imagine placeholder (adaugă o poză reală dacă dorești)
  </text>
</svg>
